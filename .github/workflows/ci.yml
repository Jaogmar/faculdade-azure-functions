name: CI/CD Github Actions
 
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
 
jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
 
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
 
      - run: python --version
 
      - name: Instalar ferramentas de qualidade
        run: pip install ruff black isort
 
      - name: Verificar sintaxe
        run: python -m py_compile function_app.py
 
      - name: Lint (ruff)
        run: ruff check .
 
      - name: Ordem dos imports (isort)
        run: isort --check-only --diff --profile black .
 
      - name: Formatação (black)
        run: black --check --diff .